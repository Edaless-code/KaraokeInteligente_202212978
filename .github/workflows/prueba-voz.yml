name: Prueba de reconocimiento de voz

on:
  workflow_dispatch:
  push:
    paths:
      - "karaoke/**"
      - "herramientas/**"
      - "ejemplos/**"
      - ".github/workflows/prueba-voz.yml"

jobs:
  transcribir:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: "Sound of You · Vosk restringido"
            audio: ejemplos/Sound_of_You.mp3
            opciones: "--idioma en --motor vosk --sin-limpieza --aislar-voz --restringido"
          - nombre: "Sound of You · Whisper base"
            audio: ejemplos/Sound_of_You.mp3
            opciones: "--idioma en --motor whisper --sin-limpieza --aislar-voz"
          - nombre: "Ghost of you · Vosk restringido"
            audio: ejemplos/Ghost_of_you_Remastered.mp3
            opciones: "--idioma en --motor vosk --sin-limpieza --aislar-voz --restringido"
          - nombre: "Ghost of you · Whisper base inglés"
            audio: ejemplos/Ghost_of_you_Remastered.mp3
            opciones: "--idioma en --motor whisper --sin-limpieza --aislar-voz"
          - nombre: "Ghost of you · Whisper base idioma automático"
            audio: ejemplos/Ghost_of_you_Remastered.mp3
            opciones: "--idioma auto --motor whisper --sin-limpieza --aislar-voz"
    name: ${{ matrix.nombre }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt faster-whisper
      - name: Modelos de voz en caché
        uses: actions/cache@v4
        with:
          path: |
            modelo
            ~/.cache/huggingface
          key: modelos-voz-v2
      - name: Descargar modelos de Vosk
        run: |
          mkdir -p modelo
          for m in vosk-model-small-es-0.42 vosk-model-small-en-us-0.15; do
            if [ ! -d "modelo/$m" ]; then
              curl -sSL -o "$m.zip" "https://alphacephei.com/vosk/models/$m.zip"
              unzip -q "$m.zip" -d modelo && rm "$m.zip"
            fi
          done
      - name: Transcribir
        run: python herramientas/transcribir.py ${{ matrix.audio }} ${{ matrix.opciones }}

  automatico:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        audio: [ejemplos/Sound_of_You.mp3, ejemplos/Ghost_of_you_Remastered.mp3]
    name: Modo automático de punta a punta · ${{ matrix.audio }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt faster-whisper
      - name: Modelos de voz en caché
        uses: actions/cache@v4
        with:
          path: |
            modelo
            ~/.cache/huggingface
          key: modelos-voz-v2
      - name: Descargar modelos de Vosk
        run: |
          mkdir -p modelo
          for m in vosk-model-small-es-0.42 vosk-model-small-en-us-0.15; do
            if [ ! -d "modelo/$m" ]; then
              curl -sSL -o "$m.zip" "https://alphacephei.com/vosk/models/$m.zip"
              unzip -q "$m.zip" -d modelo && rm "$m.zip"
            fi
          done
      - name: Simular el modo automático (Vosk + Whisper)
        run: python herramientas/simular_automatico.py ${{ matrix.audio }} --motor hibrido

  desde-audio:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        audio: [ejemplos/Sound_of_You.mp3, ejemplos/Ghost_of_you_Remastered.mp3]
    name: Agregar canción desde audio (f → m) · ${{ matrix.audio }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt faster-whisper
      - name: Modelos de voz en caché
        uses: actions/cache@v4
        with:
          path: |
            modelo
            ~/.cache/huggingface
          key: modelos-voz-v2
      - name: Borrador de la letra con Whisper
        run: python herramientas/borrador_desde_audio.py ${{ matrix.audio }}
