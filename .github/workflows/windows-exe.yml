name: Ejecutable de Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["movil/**", "docs/**", "*.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exe:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONIOENCODING: utf-8
      DESTINO: dist/KaraokeInteligente
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt faster-whisper pyinstaller pytest

      - name: Pruebas
        run: python -m pytest -q

      - name: Construir el ejecutable con PyInstaller
        run: >
          pyinstaller --noconfirm --clean --onedir --console
          --name KaraokeInteligente
          --collect-all vosk
          --collect-all faster_whisper
          --collect-all ctranslate2
          --collect-binaries sounddevice
          --collect-data _sounddevice_data
          --collect-submodules karaoke
          main.py

      - name: Modelos de voz en caché
        uses: actions/cache@v4
        with:
          path: modelos-cache
          key: modelos-windows-v1

      - name: Descargar los modelos de voz (Vosk español e inglés, Whisper base)
        run: |
          $ProgressPreference = "SilentlyContinue"   # la barra de progreso vuelve lentísima la descarga
          New-Item -ItemType Directory -Force modelos-cache | Out-Null
          foreach ($m in "vosk-model-small-es-0.42", "vosk-model-small-en-us-0.15") {
            if (-not (Test-Path "modelos-cache/$m")) {
              curl.exe -sSL --retry 3 -o "$m.zip" "https://alphacephei.com/vosk/models/$m.zip"
              tar -xf "$m.zip" -C modelos-cache
              Remove-Item "$m.zip"
            }
          }
          if (-not (Test-Path "modelos-cache/whisper-base/model.bin")) {
            python -c "from huggingface_hub import snapshot_download; snapshot_download('Systran/faster-whisper-base', local_dir='modelos-cache/whisper-base')"
          }
          Copy-Item -Recurse modelos-cache "$env:DESTINO/modelo"
          Get-ChildItem "$env:DESTINO/modelo"

      - name: Agregar ejemplos, documentación y configuración
        run: |
          Copy-Item -Recurse ejemplos "$env:DESTINO/ejemplos"
          if (Test-Path docs) { Copy-Item -Recurse docs "$env:DESTINO/docs" }
          Copy-Item README.md "$env:DESTINO/LEAME.md"
          Copy-Item ejemplos/canciones.txt "$env:DESTINO/canciones.txt"

      - name: "Prueba 1: el menú arranca, importa canciones y sale"
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $entrada = "f`nt`n`n`nr`nw`n`ns`n"
          $salida = $entrada | & "$env:DESTINO/KaraokeInteligente.exe" 2>&1 | Out-String
          Write-Output $salida
          if ($salida -notmatch "Sound of You" -or $salida -notmatch "Gracias") { throw "El menú no funcionó" }
          if (-not (Test-Path "$env:DESTINO/CANCIONES.db")) { throw "No se creó la base de datos" }
          Remove-Item "$env:DESTINO/CANCIONES.db*", "$env:DESTINO/karaoke.ini"

      - name: "Prueba 2: modo automático dentro del .exe (Vosk + Whisper)"
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $salida = & "$env:DESTINO/KaraokeInteligente.exe" --simular "$env:DESTINO/ejemplos/Ghost_of_you_Remastered.mp3" 2>&1 | Out-String
          Write-Output $salida
          if ($salida -notmatch "Canción identificada: Ghost of you") { throw "El modo automático no identificó la canción" }
          if (Test-Path "$env:DESTINO/karaoke.ini") { Remove-Item "$env:DESTINO/karaoke.ini" }

      - name: Comprimir
        run: |
          $ProgressPreference = "SilentlyContinue"
          Compress-Archive -Path "$env:DESTINO" -DestinationPath KaraokeInteligente-Windows.zip
          "{0:N0} MB" -f ((Get-Item KaraokeInteligente-Windows.zip).Length / 1MB)

      - name: Publicar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: KaraokeInteligente-Windows
          path: KaraokeInteligente-Windows.zip
          retention-days: 30

      - name: Publicar en Releases (solo con etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KaraokeInteligente-Windows.zip
