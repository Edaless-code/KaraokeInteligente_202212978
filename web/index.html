<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1220">
  <meta name="description" content="Karaoke Inteligente: la letra sigue al cantante. Reproduce tus canciones con la letra a tiempo y baja la voz del artista.">
  <title>Karaoke Inteligente</title>
  <link rel="icon" href="icono.png">
  <link rel="apple-touch-icon" href="icono.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="app">
    <!-- Barra lateral (pantallas anchas) -->
    <aside class="lateral" aria-label="Navegación">
      <div class="marca">
        <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
        <span>Karaoke</span>
      </div>
      <nav class="nav-lateral">
        <a href="#inicio" data-ruta="inicio">Inicio</a>
        <p class="nav-grupo">Cantar</p>
        <a href="#manual" data-ruta="manual">Modo manual</a>
        <a href="#automatico" data-ruta="automatico">Modo automático</a>
        <p class="nav-grupo">Canciones</p>
        <a href="#biblioteca" data-ruta="biblioteca" data-grupo="cancion editar papelera">Biblioteca</a>
        <a href="#agregar" data-ruta="agregar">Agregar canciones</a>
        <p class="nav-grupo">Sesión</p>
        <a href="#programa" data-ruta="programa">Programa</a>
        <a href="#historial" data-ruta="historial">Historial</a>
      </nav>
      <p class="firma">Edgar Alessandro Chocon Oliva<br>Carné 202212978</p>
    </aside>

    <main id="contenido" class="contenido" tabindex="-1"></main>

    <!-- Pestañas (teléfono) -->
    <nav class="pestanas" aria-label="Navegación">
      <a href="#inicio" data-ruta="inicio"><svg viewBox="0 0 24 24"><path d="M12 3 3 10v11h6v-6h6v6h6V10z"/></svg><span>Inicio</span></a>
      <a href="#biblioteca" data-ruta="biblioteca" data-grupo="cancion editar"><svg viewBox="0 0 24 24"><path d="M4 4h4v16H4zm6 0h4v16h-4zm6.6.6 3.8-1.2 4 15.2-3.8 1.2z"/></svg><span>Biblioteca</span></a>
      <a href="#manual" data-ruta="manual"><svg viewBox="0 0 24 24"><path d="M9 11.2V7a2 2 0 1 1 4 0v4.2l4.6 1a2 2 0 0 1 1.5 2.3L18 21H9.5l-4-5.4a1.6 1.6 0 0 1 2.4-2.1L9 14.6z"/></svg><span>Manual</span></a>
      <a href="#automatico" data-ruta="automatico"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg><span>Automático</span></a>
      <a href="#mas" data-ruta="mas" data-grupo="programa historial agregar papelera ajustes"><svg viewBox="0 0 24 24"><path d="M6 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"/></svg><span>Más</span></a>
    </nav>
  </div>

  <!-- Escenario: la letra a pantalla completa -->
  <section id="escenario" class="escenario" hidden aria-live="polite">
    <header class="escenario-arriba">
      <button class="boton-icono" data-accion="cerrar" aria-label="Cerrar">
        <svg viewBox="0 0 24 24"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4z"/></svg>
      </button>
      <div class="escenario-titulo"><strong id="esc-nombre"></strong><span id="esc-sub"></span></div>
      <span id="esc-estado" class="chip"></span>
    </header>
    <div class="progreso"><div id="esc-progreso"></div></div>
    <div class="letra" id="esc-letra">
      <p class="previa" id="l-previa"></p>
      <p class="actual" id="l-actual"></p>
      <p class="siguiente" id="l-siguiente"></p>
      <p class="despues" id="l-despues"></p>
    </div>
    <p class="esc-mensaje" id="esc-mensaje"></p>
    <!-- La isla: controles flotantes y semitransparentes -->
    <div class="isla" id="isla"></div>
  </section>

  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>
  <script src="app.js" type="module"></script>
</body>
</html>
